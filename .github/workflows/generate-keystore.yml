name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    name: Generate release keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # No checkout needed — keytool is standalone. JDK 17 (temurin) provides
      # the keytool command via PATH through actions/setup-java.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        id: generate
        run: |
          # Generate a strong random password once per run; it is echoed in the
          # workflow summary so you can copy it. CHANGE IT after downloading the
          # keystore artifact — this password is only a starting point.
          PASS="$(openssl rand -base64 24)"
          echo "key_password=$PASS" >> "$GITHUB_OUTPUT"
          keytool -genkeypair -v -keystore release.keystore -alias novamusic \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=NovaMusic, OU=Dev, O=NovaMusic, L=Faisalabad, S=Punjab, C=PK"

      - name: Show keystore password
        run: |
          echo "Keystore password (storepass = keypass):"
          echo "${{ steps.generate.outputs.key_password }}"

      # The keystore is never committed to the repo — download it once from
      # this artifact and store it somewhere safe.
      - name: Upload keystore
        uses: actions/upload-artifact@v7
        with:
          name: release-keystore
          path: release.keystore
          if-no-files-found: error
          retention-days: 7
