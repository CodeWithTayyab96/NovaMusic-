name: Release build (signed APK + GitHub Release)

# Manual only — never runs on push/PR. Trigger from the Actions tab:
# Actions > "Release build (signed APK + GitHub Release)" > Run workflow,
# then fill in the version input (e.g. v1.0.1).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version — used as the git tag and release title (e.g. v1.0.1). Must not already exist."
        required: true
        type: string

jobs:
  release-build:
    name: Build signed release APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Needed to create the git tag + GitHub Release with the built-in GITHUB_TOKEN.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The project requires Java 21 (kotlin.jvmToolchain(21) + compileOptions
      # JavaVersion.VERSION_21). JDK 17 cannot satisfy that toolchain and the
      # foojay auto-provisioning plugin is disabled in settings.gradle.kts, so
      # this build (like the debug workflow) runs on JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # Decode the keystore from the KEYSTORE_BASE64 secret. The build.gradle.kts
      # signingConfig reads "keystore/release.keystore" relative to the app module,
      # i.e. app/keystore/release.keystore. Fails fast if the secret is unset/empty.
      - name: Decode keystore from secret
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore
          test -s app/keystore/release.keystore || { echo "::error::Decoded keystore is empty — is KEYSTORE_BASE64 set (Settings > Secrets and variables > Actions) and valid base64?"; exit 1; }

      # Signing env vars come from repo secrets; the signingConfig in
      # app/build.gradle.kts reads them via System.getenv(...).
      # Single source of truth for the version: app/build.gradle.kts. Reading it
      # here (instead of asking for it as a second input) makes it impossible to
      # publish a tag that disagrees with the APK that was actually built.
      - name: Read version from Gradle
        run: |
          # Strip // comments first: build.gradle.kts carries a commented-out
          # versionName line that would otherwise match.
          GRADLE_KTS=$(sed 's://.*::' app/build.gradle.kts)
          VERSION_CODE=$(echo "$GRADLE_KTS" | grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' | grep -oE '[0-9]+' | head -1)
          VERSION_NAME=$(echo "$GRADLE_KTS" | grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' | sed -E 's/.*"([^"]+)"/\1/' | head -1)
          test -n "$VERSION_CODE" || { echo "::error::Could not read versionCode from app/build.gradle.kts"; exit 1; }
          test -n "$VERSION_NAME" || { echo "::error::Could not read versionName from app/build.gradle.kts"; exit 1; }
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "::notice::Building $VERSION_NAME (versionCode $VERSION_CODE)"

          # Refuse to publish a tag that disagrees with the built version
          # (e.g. tag v2.0.1 while the APK is still 2.0.0).
          TAG_VERSION="${{ inputs.version }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Tag '${{ inputs.version }}' does not match versionName '$VERSION_NAME' in app/build.gradle.kts."
            exit 1
          fi

      - name: Build signed release APK (universal)
        env:
          GIT_COMMIT: ${{ github.sha }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUniversalRelease --no-daemon --stacktrace

      # The in-app updater (Updater.kt) reads GitHub Releases directly, so the APK
      # must be a release ASSET named exactly "app-universal-release.apk"
      # (APK_ASSET_NAME in Updater.kt), not just a temporary workflow artifact.
      # Fail clearly instead of overwriting if the tag already exists.
      - name: Check release tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.version }}")
          if [ "$code" = "200" ]; then
            echo "::error::Release tag '${{ inputs.version }}' already exists. Pick a new version (e.g. v1.0.1)."
            exit 1
          fi
          if [ "$code" != "404" ]; then
            echo "::error::Unexpected GitHub API response ($code) while checking tag '${{ inputs.version }}'."
            exit 1
          fi
          echo "Tag '${{ inputs.version }}' is free."

      - name: Publish GitHub Release with APK asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/universal/release/app-universal-release.apk

      # The in-app updater compares against Android versionCode when it can, and
      # GitHub Releases have no native versionCode field. Stamp it into the release
      # notes (as an HTML comment so it is invisible when rendered) where
      # Updater.extractVersionCode() can read it via the API.
      - name: Stamp release notes with version metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.version }}" --json body -q .body > notes.md || true
          {
            echo "<!-- novamusic-version-code: $VERSION_CODE"
            echo "novamusic-version-name: $VERSION_NAME -->"
            echo
            cat notes.md
          } > stamped.md
          gh release edit "${{ inputs.version }}" --notes-file stamped.md
          echo "::notice::Stamped release notes with versionCode $VERSION_CODE"

      # Always delete the decoded keystore from the runner workspace, even if the
      # build above failed, so it never lingers or gets cached/uploaded.
      - name: Clean up keystore (always)
        if: always()
        run: rm -f app/keystore/release.keystore

      - name: Upload release APK artifact (backup copy)
        uses: actions/upload-artifact@v7
        with:
          name: NovaMusic-release-apk
          path: app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 30
