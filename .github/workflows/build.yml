name: Build & Test

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The project requires Java 21 (kotlin.jvmToolchain(21) + compileOptions
      # JavaVersion.VERSION_21). JDK 17 cannot satisfy that toolchain and the
      # foojay auto-provisioning plugin is disabled in settings.gradle.kts, so
      # the build runs on JDK 21 (same as the other workflows in this repo).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # This app defines ABI product flavors (universal/arm64/armeabi/x86/x86_64),
      # so there is no plain "assembleDebug" task. The debug APK task is
      # "assembleUniversalDebug" and the output lands under
      # app/build/outputs/apk/universal/debug/.
      - name: Build debug APK (universal)
        run: ./gradlew assembleUniversalDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenTune-debug-apk
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # Deliberately a separate job with no "needs:" on build-apk: if this job
  # fails, the APK is still built and uploaded by the job above.
  build-and-test:
    name: Full build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # Runs assemble + unit tests (+ lint, which has abortOnError=false here)
      # for every ABI flavor / build type. Slow but comprehensive.
      #
      # --no-parallel --max-workers=2 is REQUIRED: building all 10 variant
      # combos (5 flavors x debug/release) in parallel spawns multiple Kotlin
      # daemons (each up to -Xmx4096M from gradle.properties), which exhausts
      # the runner's memory and dies with OutOfMemoryError: GC overhead limit
      # exceeded during release-variant codegen. Serializing the compile keeps
      # it well within the 16GB runner.
      - name: Build all variants + run unit tests
        run: ./gradlew build --no-daemon --stacktrace --no-parallel --max-workers=2
